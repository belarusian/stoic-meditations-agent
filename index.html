<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stoic Dialogue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: normal;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 80px);
        }

        .chat-messages {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .message {
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.user .content {
            background: #1a1a1a;
            color: #fff;
            padding: 20px 25px;
            border-radius: 18px 18px 2px 18px;
            line-height: 1.7;
            font-size: 1.05rem;
        }

        .message.agent {
            align-self: flex-start;
        }

        .message.agent .content {
            background: #f8f8f8;
            color: #222;
            padding: 20px 25px;
            border-radius: 18px 18px 18px 2px;
            line-height: 1.7;
            font-size: 1.05rem;
            border-left: 3px solid #1a1a1a;
        }

        .message.agent .content blockquote {
            margin: 15px 0;
            padding: 10px 15px;
            background: #f0f0f0;
            border-left: 2px solid #999;
            font-style: italic;
            color: #444;
        }

        .message.agent .content p {
            margin-bottom: 15px;
        }

        .message.agent .content p:last-child {
            margin-bottom: 0;
        }

        .message-label {
            display: none;
        }

        .chat-input-area {
            padding: 30px;
            border-top: 1px solid #e0e0e0;
            background: #fff;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: 'Georgia', serif;
            font-size: 1rem;
            resize: none;
            min-height: 60px;
            max-height: 200px;
        }

        textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        button {
            padding: 12px 30px;
            font-size: 1rem;
            border: 1px solid #1a1a1a;
            background: #1a1a1a;
            color: #fff;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #000;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header>
        <h1>Stoic Dialogue</h1>
    </header>

    <div class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here -->
        </div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Type your response..." autocomplete="off"></textarea>
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ClientFactory } from 'https://esm.sh/@a2a-js/sdk/client';

        let client = null;
        let contextId = null;

        async function connectToAgent() {
            try {
                const factory = new ClientFactory();
                client = await factory.createFromUrl('http://localhost:41242');
                console.log('Connected to Stoic Guide agent');
                return true;
            } catch (error) {
                console.error('Failed to connect to agent:', error);
                return false;
            }
        }

        function addMessage(role, text) {
            const chat = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="content">${text}</div>`;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendMessageToAgent(text) {
            if (!client || !text.trim()) return;

            // Add user message to chat
            addMessage('user', text);

            const userMessage = {
                messageId: crypto.randomUUID(),
                role: 'user',
                parts: [{ kind: 'text', text: text }],
                kind: 'message',
            };

            if (contextId) {
                userMessage.contextId = contextId;
            }

            // Show loading
            const chat = document.getElementById('chat-messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message agent';
            loadingDiv.innerHTML = `<div class="content">Consulting the Meditations...</div>`;
            chat.appendChild(loadingDiv);
            chat.scrollTop = chat.scrollHeight;

            try {
                const response = await client.sendMessage({ message: userMessage });

                // Remove loading
                chat.removeChild(loadingDiv);

                if (response.contextId) {
                    contextId = response.contextId;
                }

                let agentResponse = '';
                if (response.kind === 'message') {
                    agentResponse = response.parts[0].text;
                } else if (response.kind === 'task') {
                    if (response.history && response.history.length > 0) {
                        const agentMsg = response.history.find(m => m.role === 'agent');
                        if (agentMsg && agentMsg.parts && agentMsg.parts[0] && agentMsg.parts[0].text) {
                            agentResponse = agentMsg.parts[0].text;
                        }
                    }
                    if (!agentResponse) {
                        agentResponse = `Task state: ${response.status.state}`;
                    }
                }

                addMessage('agent', agentResponse);

            } catch (error) {
                chat.removeChild(loadingDiv);
                console.error('Error with agent:', error);
                addMessage('agent', 'Error: Could not connect to Stoic Guide. Check that the agent is running.');
            }
        }

        async function startNewDialogue() {
            const initialPrompt = "I seek guidance from the Stoic wisdom of Marcus Aurelius. What should I reflect on today?";
            
            addMessage('agent', initialPrompt);

            const userMessage = {
                messageId: crypto.randomUUID(),
                role: 'user',
                parts: [{ kind: 'text', text: initialPrompt }],
                kind: 'message',
            };

            try {
                const response = await client.sendMessage({ message: userMessage });
                if (response.contextId) {
                    contextId = response.contextId;
                }
                
                let agentResponse = '';
                if (response.kind === 'message') {
                    agentResponse = response.parts[0].text;
                } else if (response.kind === 'task') {
                    if (response.history && response.history.length > 0) {
                        const agentMsg = response.history.find(m => m.role === 'agent');
                        if (agentMsg && agentMsg.parts && agentMsg.parts[0] && agentMsg.parts[0].text) {
                            agentResponse = agentMsg.parts[0].text;
                        }
                    }
                }

                if (agentResponse) {
                    addMessage('agent', agentResponse);
                }

            } catch (error) {
                console.error('Error starting dialogue:', error);
            }
        }

        // Initialize
        (async function() {
            const connected = await connectToAgent();
            if (connected) {
                startNewDialogue();
            } else {
                addMessage('agent', 'Connecting to Stoic Guide... please wait.');
            }
        })();

        // Event listeners
        document.getElementById('send-btn').addEventListener('click', () => {
            const input = document.getElementById('user-input');
            const text = input.value;
            if (text.trim()) {
                sendMessageToAgent(text);
                input.value = '';
                input.style.height = '60px';
            }
        });

        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const input = document.getElementById('user-input');
                if (input.value.trim()) {
                    sendMessageToAgent(input.value);
                    input.value = '';
                    input.style.height = '60px';
                }
            }
        });

        document.getElementById('user-input').addEventListener('input', function() {
            this.style.height = '60px';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
    </script>
</body>
</html>
